<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI智能瞭望与智能问数系统 - 登录</title>
    <link rel="stylesheet" href="/static/dist/layui-v2.13.6/layui-v2.13.6/layui/css/layui.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-wrapper {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }
        .login-card {
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            padding: 48px 40px;
        }
        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }
        .login-logo {
            width: 56px;
            height: 56px;
            background: #1890ff;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }
        .login-logo i {
            font-size: 28px;
            color: #fff;
        }
        .login-header h1 {
            font-size: 24px;
            font-weight: 600;
            color: #262626;
            margin-bottom: 8px;
        }
        .login-header p {
            font-size: 14px;
            color: #8c8c8c;
        }
        .form-item {
            margin-bottom: 24px;
        }
        .form-label {
            display: block;
            font-size: 14px;
            color: #262626;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .form-input {
            width: 100%;
            height: 40px;
            padding: 0 12px;
            border: 1px solid #d9d9d9;
            border-radius: 6px;
            font-size: 14px;
            color: #262626;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .form-input:focus {
            outline: none;
            border-color: #1890ff;
            box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.2);
        }
        .form-input::placeholder {
            color: #bfbfbf;
        }
        .login-btn {
            width: 100%;
            height: 40px;
            background: #1890ff;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .login-btn:hover {
            background: #40a9ff;
        }
        .login-btn:active {
            background: #096dd9;
        }
        .error-box {
            background: #fff1f0;
            border: 1px solid #ffccc7;
            color: #f5222d;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }
        .error-box.show {
            display: block;
        }
        .login-tips {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: #8c8c8c;
        }
        .login-tips code {
            background: #f5f5f5;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Consolas', 'Monaco', monospace;
            color: #595959;
        }
        @media (max-width: 480px) {
            .login-card {
                padding: 32px 24px;
            }
            .login-wrapper {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">
                    <i class="layui-icon layui-icon-console"></i>
                </div>
                <h1>智能瞭望系统</h1>
                <p>AI智能瞭望与智能问数系统</p>
            </div>
            
            <div class="error-box" id="errorMsg"></div>
            
            <form id="loginForm">
                <input type="hidden" name="_xsrf" value="{{ xsrf_token }}">
                
                <div class="form-item">
                    <label class="form-label" for="username">用户名</label>
                    <input type="text" id="username" name="username" class="form-input" 
                           placeholder="请输入用户名" value="admin">
                </div>
                
                <div class="form-item">
                    <label class="form-label" for="password">密码</label>
                    <input type="password" id="password" name="password" class="form-input" 
                           placeholder="请输入密码" value="admin888">
                </div>
                
                <button type="submit" class="login-btn">登 录</button>
            </form>
            
            <div class="login-tips">
                默认账户：<code>admin</code> / <code>admin888</code>
            </div>
        </div>
    </div>
    
    <script src="/static/dist/layui-v2.13.6/layui-v2.13.6/layui/layui.js"></script>
    <script>
        layui.use(['layer'], function() {
            var layer = layui.layer;
            
            var loginForm = document.getElementById('loginForm');
            
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                var username = document.getElementById('username').value;
                var password = document.getElementById('password').value;
                var errorMsg = document.getElementById('errorMsg');
                
                errorMsg.classList.remove('show');
                
                var xhr = new XMLHttpRequest();
                xhr.open('POST', '/admin/login', true);
                xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
                
                xhr.onload = function() {
                    if (xhr.status === 200) {
                        try {
                            var result = JSON.parse(xhr.responseText);
                            if (result.success) {
                                layer.msg('登录成功', {icon: 1, time: 1000}, function() {
                                    window.location.href = '/admin/index';
                                });
                            } else {
                                errorMsg.textContent = result.message || '登录失败';
                                errorMsg.classList.add('show');
                            }
                        } catch (e) {
                            errorMsg.textContent = '响应解析错误';
                            errorMsg.classList.add('show');
                        }
                    } else {
                        errorMsg.textContent = '请求失败: ' + xhr.status;
                        errorMsg.classList.add('show');
                    }
                };
                
                xhr.onerror = function() {
                    errorMsg.textContent = '网络错误';
                    errorMsg.classList.add('show');
                };
                
                var formData = 'username=' + encodeURIComponent(username) + 
                              '&password=' + encodeURIComponent(password) +
                              '&_xsrf=' + encodeURIComponent(document.querySelector('input[name="_xsrf"]').value);
                
                xhr.send(formData);
            });
        });
    </script>
</body>
</html>
