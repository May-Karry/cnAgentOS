<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>瞭望采集 - AI智能瞭望与智能问数系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            min-height: 100vh;
            padding: 40px 24px;
            color: #e0e7ff;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 48px;
        }
        
        .page-title {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(90deg, #60a5fa, #a78bfa, #60a5fa);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradient-flow 3s linear infinite;
        }
        
        @keyframes gradient-flow {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }
        
        .subtitle {
            margin-top: 8px;
            color: #94a3b8;
            font-size: 14px;
        }
        
        .search-box {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 16px;
            padding: 8px;
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            box-shadow: 0 8px 32px rgba(15, 23, 42, 0.5);
        }
        
        .search-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #e0e7ff;
            font-size: 16px;
            padding: 12px 16px;
            outline: none;
        }
        
        .search-input::placeholder {
            color: #64748b;
        }
        
        .btn-search {
            padding: 12px 28px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-search:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(59, 130, 246, 0.4);
        }
        
        .btn-search:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .config-panel {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
        }
        
        .panel-title {
            font-size: 14px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 16px;
        }
        
        .sources-list {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
        }
        
        .source-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(30, 27, 75, 0.6);
            padding: 10px 16px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }
        
        .source-item:hover {
            background: rgba(59, 130, 246, 0.1);
        }
        
        .source-item.active {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.15);
        }
        
        .toggle-switch {
            width: 36px;
            height: 20px;
            background: #334155;
            border-radius: 10px;
            position: relative;
            transition: all 0.2s;
        }
        
        .toggle-switch.active {
            background: #3b82f6;
        }
        
        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 16px;
            height: 16px;
            background: white;
            border-radius: 50%;
            transition: all 0.2s;
        }
        
        .toggle-switch.active::after {
            left: 18px;
        }
        
        .source-name {
            font-size: 14px;
            color: #cbd5e1;
        }
        
        .params-row {
            display: flex;
            gap: 20px;
        }
        
        .param-item {
            flex: 1;
        }
        
        .param-label {
            display: block;
            font-size: 12px;
            color: #64748b;
            margin-bottom: 6px;
        }
        
        .param-input {
            width: 100%;
            padding: 10px 14px;
            background: rgba(30, 27, 75, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 10px;
            color: #e0e7ff;
            font-size: 14px;
            outline: none;
        }
        
        .param-input:focus {
            border-color: #3b82f6;
        }
        
        .result-panel {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 16px;
            padding: 24px;
        }
        
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        
        .result-title {
            font-size: 16px;
            color: #e2e8f0;
        }
        
        .status-text {
            font-size: 13px;
            color: #64748b;
        }
        
        .result-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .result-item {
            background: rgba(30, 27, 75, 0.6);
            padding: 16px;
            border-radius: 10px;
            border-left: 3px solid #3b82f6;
        }
        
        .result-title {
            font-size: 15px;
            color: #e2e8f0;
            font-weight: 500;
            margin-bottom: 6px;
        }
        
        .result-link {
            font-size: 13px;
            color: #60a5fa;
            text-decoration: none;
            word-break: break-all;
        }
        
        .result-summary {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 8px;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }
        
        .loading {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(96, 165, 250, 0.3);
            border-top-color: #60a5fa;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="page-title">⚡ 智能瞭望采集</h1>
            <p class="subtitle">一键采集网络数据，智能分析洞察</p>
        </div>
        
        <div class="search-box">
            <input type="text" class="search-input" id="keywordInput" placeholder="请输入采集关键词，例如：人工智能应用">
            <button class="btn-search" id="searchBtn">开始采集</button>
        </div>
        
        <div class="config-panel">
            <div class="panel-title">数据源选择</div>
            <div class="sources-list" id="sourcesList"></div>
            
            <div class="params-row">
                <div class="param-item">
                    <label class="param-label">采集条数</label>
                    <input type="number" class="param-input" id="maxCount" value="10" min="1" max="100">
                </div>
                <div class="param-item">
                    <label class="param-label">采集页数</label>
                    <input type="number" class="param-input" id="maxPages" value="1" min="1" max="10">
                </div>
            </div>
        </div>
        
        <div class="result-panel">
            <div class="result-header">
                <div class="result-title">采集结果</div>
                <div class="status-text" id="statusText">等待采集...</div>
            </div>
            <div class="result-list" id="resultList">
                <div class="empty-state">请点击开始采集</div>
            </div>
        </div>
    </div>
    
    <script>
        let allSources = [];
        let selectedSourceIds = [];
        let collectedData = [];
        
        function loadSources() {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', '/api/spy-sources');
            xhr.onload = function() {
                if (xhr.status === 200) {
                    var result = JSON.parse(xhr.responseText);
                    if (result.success) {
                        allSources = (result.data || []).filter(function(s) { return s.is_active; });
                        selectedSourceIds = allSources.map(function(s) { return s.id; });
                        renderSourcesList();
                    }
                }
            };
            xhr.send();
        }
        
        function renderSourcesList() {
            var container = document.getElementById('sourcesList');
            if (allSources.length === 0) {
                container.innerHTML = '<div style="color: #64748b; font-size: 14px;">暂无可选数据源，请前往数据源管理添加</div>';
                return;
            }
            
            container.innerHTML = allSources.map(function(source) {
                var isActive = selectedSourceIds.indexOf(source.id) !== -1;
                return '<div class="source-item ' + (isActive ? 'active' : '') + '" data-id="' + source.id + '">' +
                    '<div class="toggle-switch ' + (isActive ? 'active' : '') + '"></div>' +
                    '<span class="source-name">' + escapeHtml(source.name) + '</span>' +
                '</div>';
            }).join('');
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
        
        document.getElementById('sourcesList').addEventListener('click', function(e) {
            var item = e.target.closest('.source-item');
            if (!item) return;
            
            var id = parseInt(item.getAttribute('data-id'));
            var idx = selectedSourceIds.indexOf(id);
            if (idx === -1) {
                selectedSourceIds.push(id);
                item.classList.add('active');
                item.querySelector('.toggle-switch').classList.add('active');
            } else {
                selectedSourceIds.splice(idx, 1);
                item.classList.remove('active');
                item.querySelector('.toggle-switch').classList.remove('active');
            }
        });
        
        document.getElementById('searchBtn').addEventListener('click', function() {
            var keyword = document.getElementById('keywordInput').value.trim();
            var maxCount = parseInt(document.getElementById('maxCount').value);
            var maxPages = parseInt(document.getElementById('maxPages').value);
            
            if (!keyword) {
                alert('请输入关键词');
                return;
            }
            if (selectedSourceIds.length === 0) {
                alert('请至少选择一个数据源');
                return;
            }
            
            var btn = document.getElementById('searchBtn');
            var statusText = document.getElementById('statusText');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span> 采集中...';
            statusText.textContent = '正在采集，请稍候...';
            collectedData = [];
            renderResults();
            
            var xhr = new XMLHttpRequest();
            xhr.open('POST', '/api/spy-collect');
            xhr.setRequestHeader('Content-Type', 'application/json');
            xhr.onload = function() {
                btn.disabled = false;
                btn.textContent = '开始采集';
                
                if (xhr.status === 200) {
                    var result = JSON.parse(xhr.responseText);
                    if (result.success) {
                        statusText.textContent = result.message;
                        
                        // 显示调试信息
                        if (result.debug) {
                            console.log('调试信息:', result.debug);
                        }
                        
                        loadCollectedData();
                    } else {
                        statusText.textContent = '采集失败：' + result.message;
                    }
                } else {
                    statusText.textContent = '请求失败';
                }
            };
            xhr.onerror = function() {
                btn.disabled = false;
                btn.textContent = '开始采集';
                statusText.textContent = '网络错误';
            };
            xhr.send(JSON.stringify({
                keyword: keyword,
                source_ids: selectedSourceIds,
                max_count: maxCount,
                max_pages: maxPages
            }));
        });
        
        function loadCollectedData() {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', '/api/spy-data?page=1&page_size=50');
            xhr.onload = function() {
                if (xhr.status === 200) {
                    var result = JSON.parse(xhr.responseText);
                    if (result.success) {
                        collectedData = result.data || [];
                        renderResults();
                    }
                }
            };
            xhr.send();
        }
        
        function renderResults() {
            var list = document.getElementById('resultList');
            if (collectedData.length === 0) {
                list.innerHTML = '<div class="empty-state">暂无采集结果</div>';
                return;
            }
            
            list.innerHTML = collectedData.map(function(item) {
                return '<div class="result-item">' +
                    '<div class="result-title">' + escapeHtml(item.title) + '</div>' +
                    '<a href="' + escapeHtml(item.url) + '" target="_blank" class="result-link">' + escapeHtml(item.url) + '</a>' +
                    (item.summary ? '<div class="result-summary">' + escapeHtml(item.summary) + '</div>' : '') +
                '</div>';
            }).join('');
        }
        
        loadSources();
    </script>
</body>
</html>
