<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>功能管理</title>
    <link rel="stylesheet" href="/static/dist/layui-v2.13.6/layui-v2.13.6/layui/css/layui.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f0f2f5; min-height: 100vh; }
        .page-header { height: 64px; background: #fff; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .page-title { font-size: 18px; font-weight: 600; color: #262626; }
        .btn { height: 32px; padding: 0 16px; border-radius: 6px; font-size: 14px; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-primary { background: #1890ff; border: 1px solid #1890ff; color: #fff; }
        .btn-primary:hover { background: #40a9ff; border-color: #40a9ff; }
        .btn-default { background: #fff; border: 1px solid #d9d9d9; color: #595959; }
        .btn-default:hover { color: #1890ff; border-color: #1890ff; }
        .btn-danger { background: #fff; border: 1px solid #d9d9d9; color: #8c8c8c; }
        .btn-danger:hover { color: #cf1322; border-color: #ff7875; background: #fff1f0; }
        
        .main-container { display: flex; height: calc(100vh - 64px); }
        .tree-panel { width: 320px; background: #fff; border-right: 1px solid #f0f0f0; display: flex; flex-direction: column; }
        .tree-header { padding: 16px; border-bottom: 1px solid #f0f0f0; display: flex; gap: 8px; }
        .tree-search { flex: 1; height: 32px; padding: 0 12px; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 13px; }
        .tree-search:focus { outline: none; border-color: #1890ff; }
        .tree-content { flex: 1; overflow-y: auto; padding: 8px; }
        .tree-node { display: flex; align-items: center; padding: 10px 12px; cursor: pointer; border-radius: 4px; transition: all 0.2s; }
        .tree-node:hover { background: #f5f5f5; }
        .tree-node.active { background: #e6f7ff; }
        .tree-indent { display: inline-block; width: 16px; }
        .tree-icon { width: 20px; text-align: center; color: #8c8c8c; font-size: 16px; }
        .tree-name { flex: 1; font-size: 14px; color: #595959; margin-left: 8px; }
        .tree-actions { display: none; }
        .tree-node:hover .tree-actions { display: flex; gap: 4px; }
        .tree-action-btn { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; color: #8c8c8c; cursor: pointer; border-radius: 4px; }
        .tree-action-btn:hover { background: #fff; color: #1890ff; }
        
        .form-panel { flex: 1; background: #f5f7fa; padding: 24px; overflow-y: auto; }
        .form-card { background: #fff; border-radius: 8px; padding: 24px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .form-title { font-size: 16px; font-weight: 600; color: #262626; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid #f0f0f0; }
        .form-row { margin-bottom: 20px; }
        .form-label { display: block; font-size: 14px; color: #262626; margin-bottom: 8px; font-weight: 500; }
        .form-input, .form-select { width: 100%; max-width: 400px; height: 36px; padding: 0 12px; border: 1px solid #d9d9d9; border-radius: 6px; font-size: 14px; color: #262626; background: #fff; }
        .form-input:focus, .form-select:focus { outline: none; border-color: #1890ff; box-shadow: 0 0 0 2px rgba(24,144,255,0.2); }
        .form-switch { display: flex; align-items: center; gap: 8px; }
        .form-switch input[type="checkbox"] { width: 40px; height: 20px; appearance: none; background: #d9d9d9; border-radius: 10px; position: relative; cursor: pointer; }
        .form-switch input[type="checkbox"]:checked { background: #1890ff; }
        .form-switch input[type="checkbox"]::before { content: ''; width: 16px; height: 16px; background: #fff; border-radius: 50%; position: absolute; top: 2px; left: 2px; transition: left 0.2s; }
        .form-switch input[type="checkbox"]:checked::before { left: 22px; }
        .form-switch label { font-size: 14px; color: #595959; }
        .form-actions { display: flex; gap: 12px; padding-top: 24px; border-top: 1px solid #f0f0f0; }
        
        .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #8c8c8c; }
        .empty-icon { font-size: 48px; margin-bottom: 16px; }
        
        .add-root-btn { margin-top: 8px; padding: 10px; text-align: center; color: #1890ff; font-size: 14px; cursor: pointer; border: 1px dashed #1890ff; border-radius: 4px; }
        .add-root-btn:hover { background: #e6f7ff; }
    </style>
</head>
<body>
    <div class="page-header">
        <h1 class="page-title">功能管理</h1>
        <div class="btn-group">
            <button class="btn btn-default" id="btnRefresh"><i class="layui-icon layui-icon-refresh"></i> 刷新</button>
            <button class="btn btn-primary" id="btnAddRoot"><i class="layui-icon layui-icon-add-1"></i> 新增顶级菜单</button>
        </div>
    </div>
    
    <div class="main-container">
        <div class="tree-panel">
            <div class="tree-header">
                <input type="text" class="tree-search" id="treeSearch" placeholder="搜索菜单">
            </div>
            <div class="tree-content" id="treeContent">
                <div class="empty-state">
                    <i class="layui-icon layui-icon-empty empty-icon"></i>
                    <p>暂无菜单数据</p>
                </div>
            </div>
        </div>
        
        <div class="form-panel" id="formPanel">
            <div class="empty-state">
                <i class="layui-icon layui-icon-menu empty-icon"></i>
                <p>请选择或创建菜单</p>
            </div>
        </div>
    </div>
    
    <script src="/static/dist/layui-v2.13.6/layui-v2.13.6/layui/layui.js"></script>
    <script>
        layui.use(['layer'], function() {
            var layer = layui.layer;
            var allMenus = [];
            var currentMenu = null;
            
            function loadMenus() {
                var xhr = new XMLHttpRequest();
                xhr.open('GET', '/api/menus', true);
                xhr.onload = function() {
                    if (xhr.status === 200) {
                        var result = JSON.parse(xhr.responseText);
                        if (result.success) {
                            allMenus = result.data;
                            renderTree(allMenus);
                        } else {
                            layer.msg(result.message || '加载失败', {icon: 2});
                        }
                    }
                };
                xhr.send();
            }
            
            function renderTree(menus) {
                var container = document.getElementById('treeContent');
                if (!menus || menus.length === 0) {
                    container.innerHTML = '<div class="add-root-btn" onclick="addMenu(null)">+ 点击添加顶级菜单</div>';
                    return;
                }
                
                var html = '';
                function renderNodes(items, level) {
                    items.forEach(function(item) {
                        var indent = '';
                        for (var i = 0; i < level; i++) indent += '<span class="tree-indent"></span>';
                        html += '<div class="tree-node" data-id="' + item.id + '">' +
                            indent +
                            '<i class="layui-icon ' + (item.icon || 'layui-icon-app') + ' tree-icon"></i>' +
                            '<span class="tree-name">' + item.name + '</span>' +
                            '<div class="tree-actions">' +
                            '<i class="layui-icon layui-icon-add-1 tree-action-btn" onclick="addMenu(' + item.id + ')"></i>' +
                            '<i class="layui-icon layui-icon-edit tree-action-btn" onclick="editMenu(' + item.id + ')"></i>' +
                            '<i class="layui-icon layui-icon-delete tree-action-btn" onclick="deleteMenu(' + item.id + ')"></i>' +
                            '</div>' +
                            '</div>';
                        if (item.children && item.children.length > 0) {
                            renderNodes(item.children, level + 1);
                        }
                    });
                }
                renderNodes(menus, 0);
                html += '<div class="add-root-btn" onclick="addMenu(null)">+ 添加顶级菜单</div>';
                container.innerHTML = html;
                
                container.querySelectorAll('.tree-node').forEach(function(node) {
                    node.addEventListener('click', function(e) {
                        if (!e.target.classList.contains('tree-action-btn')) {
                            container.querySelectorAll('.tree-node').forEach(function(n) { n.classList.remove('active'); });
                            this.classList.add('active');
                            var menuId = parseInt(this.getAttribute('data-id'));
                            showMenuDetail(menuId);
                        }
                    });
                });
                
                if (menus.length > 0 && !currentMenu) {
                    container.querySelector('.tree-node').click();
                }
            }
            
            function showMenuDetail(menuId) {
                var menu = null;
                function findMenu(items) {
                    for (var i = 0; i < items.length; i++) {
                        if (items[i].id === menuId) {
                            menu = items[i];
                            return true;
                        }
                        if (items[i].children && findMenu(items[i].children)) return true;
                    }
                    return false;
                }
                findMenu(allMenus);
                
                if (menu) {
                    currentMenu = menu;
                    renderForm(menu);
                }
            }
            
            function renderForm(menu) {
                var html = '<div class="form-card">' +
                    '<div class="form-title">菜单详情</div>' +
                    '<div class="form-row">' +
                    '<label class="form-label">菜单名称</label>' +
                    '<input type="text" class="form-input" id="editName" value="' + (menu.name || '') + '">' +
                    '</div>' +
                    '<div class="form-row">' +
                    '<label class="form-label">路由路径</label>' +
                    '<input type="text" class="form-input" id="editUrl" value="' + (menu.url || '') + '" placeholder="如 /admin/users">' +
                    '</div>' +
                    '<div class="form-row">' +
                    '<label class="form-label">图标Class</label>' +
                    '<input type="text" class="form-input" id="editIcon" value="' + (menu.icon || '') + '" placeholder="如 layui-icon-user">' +
                    '</div>' +
                    '<div class="form-row">' +
                    '<label class="form-label">上级菜单</label>' +
                    '<select class="form-select" id="editParentId">' +
                    '<option value="0">顶级菜单</option>' +
                    buildParentOptions(allMenus, menu.id, 0) +
                    '</select>' +
                    '</div>' +
                    '<div class="form-row">' +
                    '<label class="form-label">排序号</label>' +
                    '<input type="number" class="form-input" id="editOrderNum" value="' + (menu.order_num || 0) + '">' +
                    '</div>' +
                    '<div class="form-row">' +
                    '<label class="form-label">是否显示</label>' +
                    '<div class="form-switch">' +
                    '<input type="checkbox" id="editVisible" checked>' +
                    '<label for="editVisible">是</label>' +
                    '</div>' +
                    '</div>' +
                    '<div class="form-actions">' +
                    '<button class="btn btn-default" onclick="cancelEdit()">取消</button>' +
                    '<button class="btn btn-danger" onclick="deleteMenu(' + menu.id + ')">删除菜单</button>' +
                    '<button class="btn btn-primary" onclick="saveMenu(' + menu.id + ')">保存修改</button>' +
                    '</div>' +
                    '</div>';
                document.getElementById('formPanel').innerHTML = html;
                document.getElementById('editParentId').value = menu.parent_id || 0;
            }
            
            function buildParentOptions(menus, excludeId, level) {
                var html = '';
                menus.forEach(function(menu) {
                    if (menu.id !== excludeId) {
                        var indent = '';
                        for (var i = 0; i < level; i++) indent += '　　';
                        html += '<option value="' + menu.id + '">' + indent + menu.name + '</option>';
                        if (menu.children && menu.children.length > 0) {
                            html += buildParentOptions(menu.children, excludeId, level + 1);
                        }
                    }
                });
                return html;
            }
            
            function addMenu(parentId) {
                var parentName = '顶级菜单';
                if (parentId) {
                    function findParent(items) {
                        for (var i = 0; i < items.length; i++) {
                            if (items[i].id === parentId) {
                                parentName = items[i].name;
                                return true;
                            }
                            if (items[i].children && findParent(items[i].children)) return true;
                        }
                        return false;
                    }
                    findParent(allMenus);
                }
                
                layer.prompt({title: '请输入菜单名称', formType: 0}, function(name, index) {
                    if (!name) {
                        layer.msg('请输入菜单名称', {icon: 2});
                        return;
                    }
                    
                    var xhr = new XMLHttpRequest();
                    xhr.open('POST', '/api/menus', true);
                    xhr.setRequestHeader('Content-Type', 'application/json');
                    xhr.onload = function() {
                        if (xhr.status === 200) {
                            var result = JSON.parse(xhr.responseText);
                            if (result.success) {
                                layer.msg('创建成功', {icon: 1});
                                loadMenus();
                            } else {
                                layer.msg(result.message || '创建失败', {icon: 2});
                            }
                        }
                    };
                    xhr.send(JSON.stringify({name: name, parent_id: parentId || 0, order_num: 0}));
                    layer.close(index);
                });
            }
            
            function editMenu(menuId) {
                document.querySelector('.tree-node[data-id="' + menuId + '"]').click();
            }
            
            function deleteMenu(menuId) {
                layer.confirm('确定要删除该菜单吗？', function(index) {
                    var xhr = new XMLHttpRequest();
                    xhr.open('DELETE', '/api/menus/' + menuId, true);
                    xhr.onload = function() {
                        if (xhr.status === 200) {
                            var result = JSON.parse(xhr.responseText);
                            if (result.success) {
                                layer.msg('删除成功', {icon: 1});
                                loadMenus();
                                document.getElementById('formPanel').innerHTML = '<div class="empty-state"><i class="layui-icon layui-icon-menu empty-icon"></i><p>请选择或创建菜单</p></div>';
                                currentMenu = null;
                            } else {
                                layer.msg(result.message || '删除失败', {icon: 2});
                            }
                        }
                    };
                    xhr.send();
                    layer.close(index);
                });
            }
            
            function saveMenu(menuId) {
                var name = document.getElementById('editName').value;
                var url = document.getElementById('editUrl').value;
                var icon = document.getElementById('editIcon').value;
                var parentId = parseInt(document.getElementById('editParentId').value);
                var orderNum = parseInt(document.getElementById('editOrderNum').value) || 0;
                
                if (!name) {
                    layer.msg('请输入菜单名称', {icon: 2});
                    return;
                }
                
                var xhr = new XMLHttpRequest();
                xhr.open('PUT', '/api/menus/' + menuId, true);
                xhr.setRequestHeader('Content-Type', 'application/json');
                xhr.onload = function() {
                    if (xhr.status === 200) {
                        var result = JSON.parse(xhr.responseText);
                        if (result.success) {
                            layer.msg('保存成功', {icon: 1});
                            loadMenus();
                        } else {
                            layer.msg(result.message || '保存失败', {icon: 2});
                        }
                    }
                };
                xhr.send(JSON.stringify({name: name, url: url, icon: icon, parent_id: parentId, order_num: orderNum}));
            }
            
            function cancelEdit() {
                if (currentMenu) {
                    showMenuDetail(currentMenu.id);
                }
            }
            
            document.getElementById('btnRefresh').addEventListener('click', loadMenus);
            document.getElementById('btnAddRoot').addEventListener('click', function() { addMenu(null); });
            
            document.getElementById('treeSearch').addEventListener('input', function(e) {
                var keyword = e.target.value.toLowerCase();
                document.querySelectorAll('.tree-node').forEach(function(node) {
                    var name = node.querySelector('.tree-name').textContent.toLowerCase();
                    node.style.display = name.includes(keyword) ? '' : 'none';
                });
            });
            
            loadMenus();
        });
    </script>
</body>
</html>
