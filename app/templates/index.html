{% extends "base.html" %}

{% block style %}
<style>
    h3 { color: #333; margin-bottom: 20px; }
    .logout-btn { 
        background-color: #dc3545; 
        color: white; 
        border: none; 
        padding: 10px 20px; 
        cursor: pointer;
        border-radius: 4px;
    }
    .logout-btn:hover { background-color: #c82333; }
    .user-info { margin: 20px 0; font-size: 16px; }
</style>
{% end %}

{% block body %}
<h3>后台页面</h3>

<form action="/auth/logout" method="post">
    {% raw xsrf_form_html() %}
    <button type="submit" class="logout-btn">退出</button>
</form>
<div class="user-info">当前用户: {{ username }}</div>
{% end %}
